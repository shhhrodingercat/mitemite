name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install homeassistant pytest pytest-homeassistant-custom-component ruff
      - run: ruff check .
      - run: pytest -q
